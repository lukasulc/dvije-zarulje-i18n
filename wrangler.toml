name = "dvije-zarulje"
compatibility_date = "2026-04-29"
main = "worker/index.js"

[[routes]]
pattern = "dvije-zarulje.hr"
custom_domain = true

[assets]
directory = "dist"
binding = "ASSETS"

[vars]
CONTACT_TO_EMAIL = "contact@dvije-zarulje.hr"
CONTACT_FROM_EMAIL = "no-reply@dvije-zarulje.hr"
TURNSTILE_HOSTNAMES = "dvije-zarulje.hr,,www.dvije-zarulje.hr"

[[send_email]]
name = "EMAIL"

[env.staging]
name = "dvije-zarulje-staging"

[[env.staging.routes]]
pattern = "staging.dvije-zarulje.hr"
custom_domain = true

[env.staging.assets]
directory = "dist"
binding = "ASSETS"
