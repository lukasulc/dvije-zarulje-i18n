name: Sync Menu from Google Sheets
on:
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore menu hash
        uses: actions/cache/restore@v4
        with:
          path: last-build-hash.txt
          key: menu-build-hash-sync-${{ github.run_id }}
          restore-keys: |
            menu-build-hash-sync-

      - name: Install dependencies
        run: npm ci

      - name: Check Google Sheet and trigger Cloudflare deploy
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || vars.SPREADSHEET_ID }}
          GOOGLE_SHEETS_GID: ${{ secrets.GOOGLE_SHEETS_GID || vars.GOOGLE_SHEETS_GID }}
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: node scripts/deploy-check.mjs

      - name: Save menu hash
        uses: actions/cache/save@v4
        if: success()
        with:
          path: last-build-hash.txt
          key: menu-build-hash-sync-${{ github.run_id }}
