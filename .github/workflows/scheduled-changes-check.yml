name: Build & Deploy if Data Changed

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  check-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      changed: ${{ steps.data.outputs.changed }}
      hash: ${{ steps.data.outputs.hash }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore data hash
        uses: actions/cache/restore@v5
        with:
          path: last-build-hash.txt
          key: data-build-hash-${{ github.run_id }}
          restore-keys: |
            data-build-hash-

      - name: Install dependencies
        run: npm ci

      - name: Check Google Sheet
        id: data
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || vars.SPREADSHEET_ID }}
          GOOGLE_SHEETS_GID: ${{ secrets.GOOGLE_SHEETS_GID || vars.GOOGLE_SHEETS_GID }}
        run: node scripts/deploy-check.mjs

  deploy:
    needs: check-data
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || needs.check-data.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || vars.SPREADSHEET_ID }}
          GOOGLE_SHEETS_GID: ${{ secrets.GOOGLE_SHEETS_GID || vars.GOOGLE_SHEETS_GID }}
          PUBLIC_SITE_URL: https://www.dvije-zarulje.hr
          PUBLIC_NOINDEX: "false"
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Prepare data hash
        run: printf '%s\n' '${{ needs.check-data.outputs.hash }}' > last-build-hash.txt

      - name: Save data hash
        uses: actions/cache/save@v5
        if: success()
        with:
          path: last-build-hash.txt
          key: data-build-hash-${{ needs.check-data.outputs.hash }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging site
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || vars.SPREADSHEET_ID }}
          GOOGLE_SHEETS_GID: ${{ secrets.GOOGLE_SHEETS_GID || vars.GOOGLE_SHEETS_GID }}
          PUBLIC_SITE_URL: https://staging.dvije-zarulje.hr
          PUBLIC_NOINDEX: "true"
        run: npm run build

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
